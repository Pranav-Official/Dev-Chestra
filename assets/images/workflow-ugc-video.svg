<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560" role="img" aria-labelledby="t d">
<title id="t">AI UGC video workflow</title>
<desc id="d">Product images go in. Agents write the script, cast influencer options and pick the best one. A for-each step generates each shot with the Higgsfield MCP, then an agent edits the video with HyperFrames. A reviewer checks it against the script: defects go to a fix pass, and clean or fixed videos are posted to social media by a shell step.</desc>
