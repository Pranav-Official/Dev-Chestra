<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1368 450" width="1368" height="450" role="img" aria-labelledby="t d">
<title id="t">Fix failing tests starter workflow</title>
<desc id="d">Start, run tests, then a gate: green ends as Already green, otherwise a loop of up to three fix-and-retest rounds. The loop body is an agent that fixes the failure and a shell step that reruns the tests. If the loop succeeds an approval asks to keep the changes, ending as Fixed or Declined; if the loop is exhausted the run ends as Still failing.</desc>
