.kind{font-size:10px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;fill:#a9aeb9}
.name{font-size:12.5px;font-weight:600;fill:#eceef1}
.meta,.row{font:10.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#a9aeb9}
.row{font-size:10px}
.edge{fill:none;stroke:#7a818d;stroke-width:1.5}
.handle{fill:#272a31;stroke:#5a5f6b;stroke-width:1.5}
</style></defs>
