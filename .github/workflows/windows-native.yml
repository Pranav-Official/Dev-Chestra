name: Windows native
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:windows
      - run: pnpm --filter @devchestra/adapters exec vitest run --maxWorkers=1 test/prompt-transport.test.ts test/windows-command-line.test.ts test/opencode.test.ts test/pi.test.ts
      - run: pnpm --filter @devchestra/engine exec vitest run test/loops.test.ts test/loops-integration.test.ts
      - run: pnpm --filter @devchestra/cli exec vitest run test/loops-workflow.test.ts
